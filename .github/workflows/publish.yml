name: Publish

on:
  push:
    tags: ['v*']

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  publish-vscode:
    name: Publish VSCode Extension
    needs: check
    runs-on: ubuntu-latest
    # TODO: 需要 VSCE_TOKEN secret 配置后才能启用
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C packages/vscode-extension vsce publish -p ${{ secrets.VSCE_TOKEN }}

  publish-cli:
    name: Publish CLI to npm
    needs: check
    runs-on: ubuntu-latest
    # TODO: 需要 NPM_TOKEN secret 配置后才能启用
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C packages/cli publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
